#define los contenedores que se van a ejecutar.
services:
  # nombre lógico del servicio.
  postgres:
    #  usa la imagen oficial de PostgreSQL versión 17
    image: postgres:17
    # nombre fijo del contenedor (útil para identificarlo)
    container_name: postgres-fullstack-lab
    # el contenedor se reinicia automáticamente salvo que lo detengas manualmente.
    restart: unless-stopped
    # variables de entorno para configurar la base de datos:
    environment:
      POSTGRES_DB: fullstacklab
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    # mapea el puerto interno 5432 al mismo puerto en tu máquina.
    ports:
      - "5432:5432"
    # persiste los datos en un volumen llamado postgres_data.
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # Servicio de caché y almacenamiento en memoria expuesto en el puerto 6379.
  redis:
    image: redis:7

    container_name: redis-fullstack-lab

    restart: unless-stopped

    ports:
      - "6379:6379"
  # Define un broker Kafka con roles de broker y controlador. Configura listeners para comunicación interna y externa. KAFKA_ADVERTISED_LISTENERS asegura que otros servicios sepan cómo conectarse.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper-fullstack-lab
    ports:
        - "2181:2181"
    environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-fullstack-lab
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
        - zookeeper

        
  # Servicio principal de tu aplicación.    
  backend:
    build: ./backend
    
    image: backend-fullstack-lab:latest

    container_name: backend-fullstack-lab

    restart: unless-stopped
    # asegura que Postgres, Redis y Kafka estén listos antes de iniciar.
    depends_on:
      - postgres
      - redis
      - kafka

    ports:
      - "8081:8081"
    # Variables de entorno conectan el backend con los otros servicios.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fullstacklab
      DB_USER: admin
      DB_PASSWORD: admin

      REDIS_HOST: redis

      KAFKA_HOST: kafka:9092
      
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000,https://app.tusitio.com
      
  frontend:
    build: ./frontend
    image: frontend-fullstack-lab:latest
    container_name: frontend-fullstack-lab
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  
  
#Cada servicio en Docker Compose se traduce en Deployment + Service en Kubernetes.

#Las variables de entorno que aquí defines directamente, en Kubernetes se manejan con ConfigMaps y Secrets.

#Los puertos expuestos (5432, 6379, 9092, 8080) en Compose se convierten en Services en Kubernetes.


#Orquesta los servicios base (Postgres, Redis, Kafka y Backend) en un entorno local.
#Cada servicio define su imagen, puertos, variables y dependencias.

#Propósito:

#Permite levantar todo el entorno con un solo comando (docker-compose up).