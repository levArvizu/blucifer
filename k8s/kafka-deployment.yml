# 
apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka

spec:
  #  un pod de Kafka (suficiente para desarrollo).
  replicas: 1

  selector:
    # etiqueta que identifica los pods de Kafka.
    matchLabels:
        # nombre del contenedor.
      app: kafka

  template:

    metadata:
      labels:
        app: kafka

    spec:

      containers:

        - name: kafka
          # imagen oficial de Kafka.
          image: confluentinc/cp-kafka:7.6.1
          
          imagePullPolicy: IfNotPresent

          # puerto principal de Kafka para clientes.
          ports:
            - containerPort: 9092
          
          # variables de entorno que configuran el broker:
          env:
 
            - name: KAFKA_BROKER_ID
              value: "1"

            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"

            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"

            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

          resources:
              requests:
                cpu: "250m"
                memory: "512Mi"

              limits:
                cpu: "500m"
                memory: "1Gi"
                
