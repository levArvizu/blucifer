apiVersion: v1

#  recurso para almacenar información sensible (contraseñas, claves).
kind: Secret

metadata:
  name: backend-secret 
  # tipo genérico de secreto.
type: Opaque

stringData:
# usuario de la base de datos
  DB_USER: admin
# contraseña del usuario.
  DB_PASSWORD: admin
# clave secreta para firmar tokens JWT.
  JWT_SECRET: my-secret-key
  
  JWT_EXPIRATION: "3600000"

  
# El Backend Deployment usa este Secret con valueFrom.secretKeyRef.

# El ConfigMap provee las rutas y hosts de conexión.

# El Secret provee credenciales y claves de seguridad.

# El Backend Deployment combina ambos para levantar la aplicación con la configuración correcta.

# En tu application.yml, las variables ${DB_URL}, ${DB_USER}, ${DB_PASSWORD}, ${REDIS_HOST}, ${KAFKA_HOST} se resuelven gracias a estos recursos.