apiVersion: v1

kind: Service

metadata:
  name: backend-service

spec:

  selector:
    #  selecciona pods con la etiqueta app: backend.
    app: backend

  ports:
    # expone el backend en el puerto 8080.
    - port: 8081
    # expone el backend en el puerto 8080.
      targetPort: 8081

  type: ClusterIP